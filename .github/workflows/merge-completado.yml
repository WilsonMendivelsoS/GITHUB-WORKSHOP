name: "🏆 Merge completado"

on:
  pull_request:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  celebrar-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Comentar felicitación
        uses: actions/github-script@v7
        with:
          script: |
            const nombre = context.payload.pull_request.user.login;
            const mensaje = [
              `### 🏆 ¡Excelente trabajo, @${nombre}!`,
              "",
              "Tu Pull Request fue mergeado exitosamente. Completaste el ciclo completo: crear rama → hacer cambios → abrir Pull Request → merge.",
              "",
              "¡Ya sabes lo esencial del flujo de trabajo con GitHub! 🚀"
            ].join("\n");

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: mensaje
            });
